<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Glow rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Wallet body -->
  <rect x="80" y="160" width="352" height="220" rx="28" ry="28" fill="url(#wallet)" filter="url(#shadow)" opacity="0.95"/>
  <!-- Wallet top flap -->
  <rect x="80" y="160" width="352" height="75" rx="28" ry="28" fill="rgba(255,255,255,0.12)"/>
  <rect x="80" y="210" width="352" height="25" fill="rgba(255,255,255,0.08)"/>
  <!-- Card slot lines -->
  <rect x="110" y="265" width="160" height="10" rx="5" fill="rgba(255,255,255,0.25)"/>
  <rect x="110" y="287" width="120" height="8" rx="4" fill="rgba(255,255,255,0.18)"/>
  <rect x="110" y="307" width="140" height="8" rx="4" fill="rgba(255,255,255,0.18)"/>
  <!-- Coin pocket -->
  <circle cx="360" cy="295" r="55" fill="rgba(0,0,0,0.2)"/>
  <circle cx="360" cy="295" r="48" fill="url(#chip)"/>
  <circle cx="360" cy="295" r="36" fill="rgba(255,255,255,0.15)"/>
  <!-- Coin symbol ₺ adapted as ﷼ look -->
  <text x="360" y="308" font-size="38" font-weight="900" text-anchor="middle" fill="rgba(120,60,0,0.8)" font-family="serif">﷼</text>
  <!-- Chip on top flap -->
  <rect x="210" y="176" width="48" height="38" rx="6" fill="url(#chip)"/>
  <rect x="216" y="182" width="36" height="26" rx="4" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="210" y1="195" x2="258" y2="195" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- Sparkle / star -->
  <g transform="translate(430,140)" fill="#fbbf24" opacity="0.9">
    <polygon points="0,-12 3,-4 12,-4 5,2 8,11 0,6 -8,11 -5,2 -12,-4 -3,-4" transform="scale(0.8)"/>
  </g>
  <g transform="translate(90,140)" fill="#a78bfa" opacity="0.7">
    <polygon points="0,-8 2,-3 8,-3 3,1 5,8 0,4 -5,8 -3,1 -8,-3 -2,-3" transform="scale(0.7)"/>
  </g>
</svg>
